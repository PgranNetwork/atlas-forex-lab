[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "atlas-forex-lab"
version = "0.1.0"
description = "Open-source research-mode forex and gold forecasting bot foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Atlas Forex Lab contributors"}]
dependencies = ["pydantic>=2.7,<3", "typer>=0.12,<1"]
[project.optional-dependencies]
research = ["numpy>=1.26", "pandas>=2.2"]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
telegram = ["python-telegram-bot>=21.0,<23"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
[project.scripts]
atlas = "atlas_forex_lab.cli.main:app"
atlas-telegram = "atlas_forex_lab.telegram_bot.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
